<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-title" content="兩層抽">
<meta name="app-version" content="v1">
<title>兩層抽籤 · Two-Layer Random</title>
<style>
  :root{--bg:#0b0f14;--card:#141b23;--card2:#1b242e;--line:#26313d;--fg:#e8eef5;--dim:#8fa1b3;--accent:#4ea1ff;--ok:#35d07f;--warn:#ffb020}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans CJK TC",system-ui,sans-serif;
    padding:20px 16px calc(28px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:21px;margin:0 0 4px}
  p.sub{color:var(--dim);font-size:13px;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .lbl{color:var(--dim);font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
  .big{font-size:26px;font-weight:700;min-height:34px;word-break:break-all}
  .big.dim{color:var(--dim);font-weight:500;font-size:20px}
  .big.spin{color:var(--warn)}
  .big.done{color:var(--ok)}
  .small{color:var(--dim);font-size:12px;margin-top:6px}
  button{
    width:100%;border:0;border-radius:14px;padding:18px;font-size:18px;font-weight:700;
    background:var(--accent);color:#06121f;margin-bottom:10px;
  }
  button:active{transform:scale(.99)}
  button.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--line);font-size:15px;padding:14px}
  button[disabled]{opacity:.5}
  .hist{color:var(--dim);font-size:12px;line-height:1.7;margin-top:6px}
  .hist b{color:var(--fg);font-weight:600}
  .note{color:var(--dim);font-size:12px;border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
  .ver{color:#3d4b57;font-size:11px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>兩層抽籤</h1>
  <p class="sub">第一層抽資料夾，第二層抽嗰個資料夾入面嘅一項。</p>

  <div class="card">
    <div class="lbl">第一層 · Top folder</div>
    <div class="big dim" id="l1">—</div>
    <div class="small" id="l1meta"></div>
  </div>

  <div class="card">
    <div class="lbl">第二層 · Inside</div>
    <div class="big dim" id="l2">—</div>
    <div class="small" id="l2meta"></div>
  </div>

  <button id="both">🎲 開始抽</button>
  <button class="ghost" id="again2">↻ 只再抽第二層</button>

  <div class="card">
    <div class="lbl">最近抽過</div>
    <div class="hist" id="hist">—</div>
  </div>

  <div class="note" id="note"></div>
  <div class="ver">v1</div>
</div>

<script>
const VERSION = 'v1';

/* Data read from DS file on the Synology NAS (TH personal → Personal).
   Update these lists and bump VERSION whenever the folders change. */
const DATA = {
  "New Downloads": ["CAWB-049","CAWB-034","MIDA-806","WAAA-696","MCSR-642","MGNL-194","092726-001-CARIB","BOKD-320","DSOD-072","DDK-241","DSOD-066","MIKR-108","MFYD-186","START-637","KNKS-001","DSOD-037","GMEM-154","NGHJ-071","RAPD-013","RCTD-756","DVEH-093","SNOS-297","SCOP-915","OFTR-012","AVSA-445","MISM-437","SVMGM-049","LULU-436","MVSD-692"],
  "Video New": ["MEYD-815","041523_001-1PON","SSIS-737","NKD-304","MOGI-090","SSIS-759","MISM-279","NHDTB-808","NNPJ-572","MVSD-553","EBWH-029","TKOU-006","MVSD-565","HJMO-626","OMHD-033","HMN-494","ERDM-073","NITR-541","TOTTE-143","KSBJ-274","IPZZ-129","071MXDLP-0205","MISM-297","JUFE-542","CEMD-450","SONE-010","NHDTB-869","MVG-076","MIBB-035","SKMJ-484","DVMM-073","USBA-073","YMDD-371","HAWA-313","PPPE-198","SDJS-251"],
  "Older": [],
  "Video Part 1": ["hdd600.com@STARS-140_UNCENSORED_LEAKED_NOWATERMARK.mp4","hdd600.com@STARS-134_UNCENSORED_LEAKED_NOWATERMARK.mp4","hhd800.com@SDMU-963_Uncensored_Leaked.mp4","pexv.xyz-HODV-21626","avmans.com-BSTC060","WAAA-123","HJMO-483 (2)","NHDTB-651","MXSPS-683","DVDMS-840","ACZD-092","ABW-088","ABW-005_uncensored","MISM-264","DVDMS-931","MISM-267","ABW-343","GMEM-092","MAZO-031"]
};

const ROLLABLE = Object.keys(DATA).filter(k => DATA[k].length > 0);
const EMPTY = Object.keys(DATA).filter(k => DATA[k].length === 0);

const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];

let L1 = null;
let history = [];
let busy = false;

function showNote() {
  const parts = ROLLABLE.map(k => `${k} (${DATA[k].length})`).join(' · ');
  let html = `第一層可抽：<b>${parts}</b>`;
  if (EMPTY.length) html += `<br>唔會抽到：<b>${EMPTY.join(', ')}</b>（空）`;
  $('note').innerHTML = html;
  $('l1meta').textContent = `共 ${ROLLABLE.length} 個資料夾`;
}

function render() {
  $('l1').textContent = L1 || '—';
  $('l1').className = 'big' + (L1 ? ' done' : ' dim');
  if (L1) $('l1meta').textContent = `${DATA[L1].length} 個項目`;
}

function spinTo(el, values, final, ms, done) {
  return new Promise(res => {
    const t0 = Date.now();
    const iv = setInterval(() => {
      el.textContent = pick(values);
      if (Date.now() - t0 > ms) {
        clearInterval(iv);
        el.textContent = final;
        el.className = 'big done';
        if (done) done();
        res();
      }
    }, 70);
  });
}

async function rollAll() {
  if (busy) return;
  busy = true;
  $('both').disabled = true;
  $('again2').disabled = true;

  L1 = pick(ROLLABLE);
  $('l1').className = 'big spin';
  $('l2').className = 'big spin';
  $('l2').textContent = '…';
  await spinTo($('l1'), ROLLABLE, L1, 900);

  const item = pick(DATA[L1]);
  $('l2').textContent = '';
  await spinTo($('l2'), DATA[L1], item, 1100);
  $('l2meta').textContent = `來自「${L1}」`;

  history.unshift(`${L1} → ${item}`);
  history = history.slice(0, 5);
  $('hist').innerHTML = history.map(h => `<b>${h}</b>`).join('<br>');

  busy = false;
  $('both').disabled = false;
  $('again2').disabled = false;
}

async function roll2() {
  if (busy || !L1) return;
  busy = true;
  $('again2').disabled = true;
  const item = pick(DATA[L1]);
  $('l2').className = 'big spin';
  await spinTo($('l2'), DATA[L1], item, 900);
  $('l2meta').textContent = `來自「${L1}」`;
  history.unshift(`${L1} → ${item}`);
  history = history.slice(0, 5);
  $('hist').innerHTML = history.map(h => `<b>${h}</b>`).join('<br>');
  busy = false;
  $('again2').disabled = false;
}

$('both').addEventListener('click', rollAll);
$('again2').addEventListener('click', roll2);
showNote();
render();
$('l2meta').textContent = '撳「開始抽」';
</script>
</body>
</html>
