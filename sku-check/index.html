<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f14">
<meta name="robots" content="noindex,nofollow">
<meta name="app-version" content="v1-TEST">
<title>Stock Check · 庫存查詢 (TEST)</title>
<style>
  :root{--bg:#0b0f14;--card:#141b23;--card2:#1b242e;--line:#26313d;--fg:#e8eef5;--dim:#8fa1b3;--accent:#4ea1ff;--ok:#35d07f;--bad:#ff5d5d;--warn:#ffb020}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);min-height:100vh;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans CJK TC",system-ui,sans-serif;
    padding:18px 14px calc(28px + env(safe-area-inset-bottom));}
  .wrap{max-width:620px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12px;margin:0 0 14px}
  .testbar{background:#3a2a05;border:1px solid #6b4d05;color:#ffd479;font-size:12px;
    border-radius:10px;padding:8px 10px;margin-bottom:12px}
  input{width:100%;padding:16px;font-size:17px;border-radius:14px;border:1px solid var(--line);
    background:var(--card);color:var(--fg);outline:none}
  input:focus{border-color:var(--accent)}
  .meta{color:var(--dim);font-size:12px;margin:10px 0 14px}
  .result{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .pn{font-weight:700;font-size:16px;word-break:break-all}
  .qty{font-size:15px;margin-top:6px}
  .qty b{font-size:22px}
  .instock{color:var(--ok)}
  .nostock{color:var(--bad);font-weight:700}
  .empty{color:var(--dim);text-align:center;padding:26px 10px}
  .hint{color:var(--dim);font-size:12px;border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
  .ver{color:#3d4b57;font-size:11px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>庫存查詢 · Stock Check</h1>
  <p class="sub">輸入料號（或關鍵字）→ 顯示可供應數量</p>

  <div class="testbar">⚠️ 測試版（TEST）— 資料為一個時間點快照，只顯示 Public Qty。未正式對外。</div>

  <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="characters"
         placeholder="例：PRIME H610M-E D4 / RTX5080 / B860M" autofocus>
  <div class="meta" id="meta"></div>
  <div id="out"><div class="empty">輸入料號或關鍵字開始查詢</div></div>

  <div class="hint">
    <b>注意</b>：只反映 <b>Public Qty</b>（可供應數量）。顯示 <b>No stock</b> = 暫時無可供數量，可向你的銷售代表查詢。<br>
    資料更新：星期一至五 10:00–18:00（每小時）。
  </div>
  <div class="ver">v1-TEST</div>
</div>

<script>
const VERSION = 'v1-TEST';
/* Snapshot read from Synnex VIP › Inventory (ASUS) on 2026-10-10 ~21:14. TEST SAMPLE. */
const UPDATED = '2026-10-10 21:14';
const DATA = [
  ["B760M-AYW WIFI", 36],
  ["B860M AYW GAMING WIFI", 35],
  ["DUAL-RTX5060-O8G", 54],
  ["DUAL-RTX5060-O8G-WHITE", 4],
  ["DUAL-RTX5060TI-O16G", 0],
  ["DUAL-RTX5060TI-O16G-WHITE", 24],
  ["DUAL-RTX5060TI-O8G", 0],
  ["DUAL-RTX5070-O12G", 5],
  ["PRIME B760M-A D4", 73],
  ["PRIME B760M-A WIFI", 0],
  ["PRIME B760M-A WIFI D4", 53],
  ["PRIME B860-PLUS WIFI-CSM", 9],
  ["PRIME B860M-A WIFI-CSM", 27],
  ["PRIME B860M-A-CSM", 20],
  ["PRIME B860M-K-CSM", 11],
  ["PRIME H610M-E D4", 325],
  ["PRIME H610M-K D4", 20],
  ["PRIME Z890-P WIFI-CSM", 16],
  ["PRIME Z890M-PLUS WIFI-CSM", 4],
  ["PRIME-RTX5060-O8G", 0],
  ["PRIME-RTX5060TI-O16G", 0],
  ["PRIME-RTX5060TI-O8G", 0],
  ["PRIME-RTX5070-O12G", 0],
  ["PRIME-RTX5070-O12G-WHITE", 15],
  ["PRIME-RTX5070TI-O16G", 17],
  ["PRIME-RTX5080-O16G", 0],
  ["PRIME-RTX5080-O16G-EVO", 0],
  ["PROART Z890-CREATOR WIFI", 2],
  ["PROART-RTX5070TI-O16G", 22],
  ["PROART-RTX5080-O16G", 8],
  ["ROG STRIX B860-A GAMING WIFI", 1],
  ["ROG STRIX B860-F GAMING WIFI", 2],
  ["ROG STRIX B860-G GAMING WIFI", 0],
  ["ROG STRIX B860-I GAMING WIFI", 11],
  ["ROG STRIX Z890-A GAMING WIFI", 1],
  ["ROG STRIX Z890-E GAMING WIFI", 0],
  ["ROG STRIX Z890-F GAMING WIFI", 0],
  ["ROG-ASTRAL-RTX5080-O16G-GAMING", 0],
  ["ROG-ASTRAL-RTX5080-O16G-WHITE", 0],
  ["ROG-ASTRAL-RTX5090DV2-O24G-BTF", 0],
  ["ROG-STRIX-RTX5070-O12G-GAMING", 0],
  ["ROG-STRIX-RTX5070TI-O16G-GAMING", 0],
  ["RTX5060-O8G-LP-BRK", 0],
  ["RTX5080-O16G-NOCTUA", 0],
  ["T1-RTX5060TI-O8G-GAMING", 0],
  ["T1-RTX5070-O12G-GAMING", 19],
  ["TUF GAMING B760M-PLUS II", 20],
  ["TUF GAMING B760M-PLUS WIFI D4", 1],
  ["TUF GAMING B760M-PLUS WIFI II", 12],
  ["TUF GAMING B860-PLUS WIFI", 53],
  ["TUF GAMING B860M-PLUS WIFI", 56],
  ["TUF GAMING Z890-PLUS WIFI", 3]
];

const q = document.getElementById('q');
const out = document.getElementById('out');
const meta = document.getElementById('meta');
meta.textContent = `資料最後更新：${UPDATED} · 共 ${DATA.length} 個料號（測試樣本）`;

function norm(s){ return s.toUpperCase().replace(/\s+/g,' ').trim(); }

function render(){
  const raw = q.value.trim();
  if (!raw){ out.innerHTML = '<div class="empty">輸入料號或關鍵字開始查詢</div>'; return; }
  const needle = norm(raw);
  const hits = DATA.filter(([pn]) => norm(pn).includes(needle));
  if (!hits.length){
    out.innerHTML = '<div class="empty">查不到這個料號／關鍵字<br><span style="font-size:12px">試下用短啲嘅關鍵字（例如 RTX5080、H610M）</span></div>';
    return;
  }
  out.innerHTML = hits.map(([pn, qty]) => {
    const inStock = qty > 0;
    return `<div class="result">
      <div class="pn">${pn}</div>
      <div class="qty">${inStock ? `<span class="instock">Public Qty: <b>${qty}</b></span>` : `<span class="nostock">No stock</span>`}</div>
    </div>`;
  }).join('');
}

q.addEventListener('input', render);
render();
</script>
</body>
</html>
