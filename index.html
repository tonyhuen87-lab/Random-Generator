<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-title" content="Tools">
<title>Tools · 小工具</title>
<style>
  :root{--bg:#0b0f14;--card:#141b23;--card2:#1b242e;--line:#26313d;--fg:#e8eef5;--dim:#8fa1b3;--accent:#4ea1ff}
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--fg);min-height:100vh;
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans CJK TC",system-ui,sans-serif;
    padding:28px 18px calc(40px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:24px;margin:0 0 6px}
  p.sub{color:var(--dim);margin:0 0 22px;font-size:14px}
  a.app{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--fg);
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;
  }
  a.app:active{transform:scale(.99)}
  a.app .ico{font-size:30px;line-height:1}
  a.app b{display:block;font-size:17px;font-weight:600}
  a.app small{color:var(--dim);font-size:13px}
  .tip{color:var(--dim);font-size:13px;border-top:1px solid var(--line);margin-top:22px;padding-top:16px}
  .tip code{background:var(--card2);padding:2px 6px;border-radius:6px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Tools</h1>
  <p class="sub">自己用嘅小工具 — 全部離線都用得，資料只存喺你部機。</p>

  <a class="app" href="random-list/">
    <span class="ico">🎲</span>
    <span><b>抽籤</b><small>抽 N 個、洗牌、逐個抽、隨機數字</small></span>
  </a>

  <a class="app" href="team-maker/">
    <span class="ico">👥</span>
    <span><b>分隊</b><small>權重平衡 + 「唔可以同隊」硬性限制</small></span>
  </a>

  <div class="tip">
    <b>加到主畫面（Android Chrome）</b><br>
    開上面任何一個工具 → 右上角三點 → <b>加到主畫面</b>。之後就同普通 app 一樣，一撳即開。
  </div>
</div>
</body>
</html>
