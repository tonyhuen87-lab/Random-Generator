<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Teams">
<meta name="theme-color" content="#0b0f14">
<title>Teams · 分隊</title>
<style>
  :root{
    --bg:#0b0f14; --card:#141b23; --card2:#1b242e; --line:#26313d;
    --fg:#e8eef5; --dim:#8fa1b3; --accent:#4ea1ff; --ok:#35d07f; --warn:#ffb020; --bad:#ff5f56;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans CJK TC",system-ui,sans-serif;
    padding:16px 16px calc(24px + env(safe-area-inset-bottom));
    max-width:640px;margin:0 auto;
  }
  h1{font-size:20px;margin:4px 0 14px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  h1 small{color:var(--dim);font-weight:400;font-size:12px}
  h1 .langwrap{margin-left:auto;display:flex;align-items:center;gap:6px}
  h1 .globe{font-size:15px;color:var(--dim)}
  h1 .lang{display:flex;gap:0;border:1px solid var(--accent);border-radius:999px;overflow:hidden;box-shadow:0 0 0 3px rgba(78,161,255,.12)}
  h1 .lang button{background:transparent;border:0;color:var(--fg);font-size:15px;font-weight:700;padding:8px 16px;border-radius:0}
  h1 .lang button.on{background:var(--accent);color:#04121f}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  label{display:block;font-size:13px;color:var(--dim);margin:0 0 6px}
  label .tag{color:var(--fg);font-size:12px;background:var(--card2);border-radius:6px;padding:1px 6px;margin-left:6px}
  textarea{
    width:100%;resize:vertical;background:var(--card2);color:var(--fg);
    border:1px solid var(--line);border-radius:12px;padding:12px;
    font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  #people{min-height:140px}
  .rule{min-height:64px}
  textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-2px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .row > *{flex:1 1 auto}
  input[type=number]{background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px 10px;font-size:15px;min-width:0;width:100%}
  select{background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px 10px;font-size:15px;width:100%;min-width:0}
  button{border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:600;background:var(--card2);color:var(--fg);cursor:pointer}
  button:active{transform:scale(.98)}
  button.primary{background:var(--accent);color:#04121f;width:100%;font-size:18px;padding:17px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-size:14px;padding:10px 12px;flex:0 0 auto}
  .switch{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--dim);flex:1 1 auto}
  .switch input{width:20px;height:20px;accent-color:var(--accent)}
  .hint{font-size:12px;color:var(--dim);margin-top:8px}
  .hint code{background:var(--card2);padding:1px 5px;border-radius:5px}
  .team{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:var(--card)}
  .team h2{font-size:16px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:center}
  .team h2 em{font-style:normal;font-size:12px;color:var(--dim);font-weight:400}
  .members{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
  .members li{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:14px}
  .members li b{color:var(--accent);font-weight:600;font-size:12px;margin-left:5px}
  .members li.rep{border-color:#2b6b47;background:linear-gradient(180deg,#12291d,#141b23)}
  .members li.seat{border-style:dashed;background:transparent;color:var(--dim)}
  .members li b.repb{color:var(--ok)}
  .bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .warn{background:#2a2113;border:1px solid #6b5220;color:var(--warn);border-radius:12px;padding:11px 13px;font-size:13px;margin-bottom:10px}
  .good{background:#10251a;border:1px solid #2b6b47;color:var(--ok);border-radius:12px;padding:11px 13px;font-size:13px;margin-bottom:10px}
  .hidden{display:none !important}
</style>
</head>
<body>
<h1><span data-i18n="title">分隊</span> <small>team maker</small>
  <span class="langwrap"><span class="globe">🌐</span><span class="lang">
    <button id="langZh" type="button">中文</button><button id="langEn" type="button">EN</button>
  </span></span>
</h1>

<div class="card">
  <label data-i18n="lblPeople"></label>
  <textarea id="people" spellcheck="false" data-i18n-ph="phPeople"></textarea>
  <label style="margin-top:12px" data-i18n="lblCannot"></label>
  <textarea id="cannot" class="rule" spellcheck="false" data-i18n-ph="phCannot"></textarea>
  <label style="margin-top:12px" data-i18n="lblMust"></label>
  <textarea id="must" class="rule" spellcheck="false" data-i18n-ph="phMust"></textarea>
  <label style="margin-top:12px" data-i18n="lblRepeat"></label>
  <textarea id="repeat" class="rule" spellcheck="false" data-i18n-ph="phRepeat"></textarea>
  <div class="row">
    <div style="flex:1 1 90px">
      <label data-i18n="lblTeams"></label>
      <input type="number" id="teams" value="3" min="0" max="20" step="1">
    </div>
    <div style="flex:1 1 130px">
      <label data-i18n="lblSizeMode"></label>
      <select id="sizeMode">
        <option value="cap" data-i18n="optCap"></option>
        <option value="random" data-i18n="optRandom"></option>
      </select>
    </div>
    <div style="flex:1 1 110px">
      <label data-i18n="lblSeed"></label>
      <input type="number" id="seed" min="1" step="1" data-i18n-ph="phSeed">
    </div>
  </div>
  <div class="row">
    <div style="flex:1 1 80px" class="hidden" id="sizeMinWrap">
      <label data-i18n="lblSizeMin"></label>
      <input type="number" id="sizeMin" value="1" min="1" max="99" step="1">
    </div>
    <div style="flex:1 1 80px">
      <label id="maxPerLabel"></label>
      <input type="number" id="maxPer" value="0" min="0" max="99" step="1">
    </div>
  </div>
  <div class="row">
    <label class="switch"><input type="checkbox" id="balance" checked> <span data-i18n="lblBalance"></span></label>
  </div>
  <div class="hint" data-i18n="hint"></div>
</div>

<button class="primary" id="go" data-i18n="btnGo"></button>
<div class="row" style="margin-top:10px">
  <button class="ghost" id="reroll" data-i18n="btnReroll"></button>
  <button class="ghost" id="copy" data-i18n="btnCopy"></button>
  <button class="ghost" id="demo" data-i18n="btnDemo"></button>
</div>

<div id="status" style="margin-top:14px"></div>
<div id="results"></div>

<script src="solver.js"></script>
<script>
const $ = id => document.getElementById(id);
const LS = 'teamMaker.v1';
const els = {
  people:$('people'), cannot:$('cannot'), must:$('must'), repeat:$('repeat'), teams:$('teams'), maxPer:$('maxPer'), seed:$('seed'),
  sizeMode:$('sizeMode'), sizeMin:$('sizeMin'), maxPerLabel:$('maxPerLabel'), sizeMinWrap:$('sizeMinWrap'),
  balance:$('balance'), go:$('go'), reroll:$('reroll'), copy:$('copy'), demo:$('demo'),
  results:$('results'), status:$('status'), langZh:$('langZh'), langEn:$('langEn')
};
const LETTERS = 'ABCDEFGHIJKLMNOP';

/* ---------- i18n ---------- */
const DICT = {
  zh: {
    title:'分隊',
    lblPeople:'名單 <span class="tag">每行一個，可加權重</span>',
    phPeople:'陳大文 3\n李小明 2\n黃小美\n（唔寫數字＝權重 1）',
    lblCannot:'唔可以同隊 <span class="tag">每行一對：A ! B</span>',
    phCannot:'陳大文 ! 李小明\n甲 ! 乙 ! 丙',
    lblMust:'必須同隊 <span class="tag">每行一對：A + B</span>',
    phMust:'李小明 + 王五',
    lblRepeat:'可以重複（跨隊） <span class="tag">名字 ＝ 每隊都有　·　名字 2 ＝ 最多 2 隊</span>',
    phRepeat:'陳教練\n助手 2',
    lblTeams:'隊數 <span class="tag">留空＝自動</span>',
    lblSizeMode:'每隊人數',
    optCap:'上限（最多 N 人）',
    optRandom:'隨機（最少–最多）',
    lblSeed:'種子（同一個＝同一個結果）',
    phSeed:'隨機',
    lblSizeMin:'每隊最少',
    lblMaxPer:'每隊最多 <span class="tag">0＝不限</span>',
    lblMaxPerRandom:'每隊最多（隨機上限）',
    lblBalance:'平均分配權重',
    hint:'規則寫法：<code>!</code> 或 <code>×</code> 或 <code>,</code> 都當「分開」；<code>+</code> 當「同隊」。名字要同上面名單一致。<br>想 <b>3 個人（或更多）全部唔同隊</b>：一行寫晒 —— <code>甲 ! 乙 ! 丙</code>（會自動變成互相分開）。<br>「可重複」欄：<code>陳教練</code> ＝ 每隊都要有佢；<code>助手 2</code> ＝ 最多落 2 隊（自動揀最需要嘅隊）。「每隊都有」嘅人唔計入權重平衡。<br>名單可以唔填滿 —— 設定咗「每隊最多」之後，剩返嘅位會顯示「空位」，方便你之後再填。',
    btnGo:'分隊！', btnReroll:'重新抽（換 seed）', btnCopy:'複製結果', btnDemo:'載入示範',
    okBanner:'✅ 全部規則滿足，{T} 隊、{N} 人',
    withRepeats:'（含 {k} 個可重複）',
    sizeRandom:' · 每隊人數隨機 {a}–{b}',
    sizeCap:' · 每隊上限 {n}',
    actualSizes:'<br>實際每隊人數：{list}',
    teamWord:'隊', membersWord:'人 · 總權重 {w}',
    everyTeam:'每隊', seat:'空位', empty:'（空）',
    needInput:'先輸入名單；或者設定「每隊最多」即可以淨係排空位。',
    emptyListNote:'名單係空嘅 —— 可以淨係排空位，之後再填名。',
    autoTeams:'隊數留空 → 自動用 {n} 隊',
    solved:'（用 {ms}ms 搜完，seed {s}）',
    copied:'已複製 ✓', copyFail:'複製失敗，長按結果自己複製',
    idle:'輸入名單（同規則）再撳「分隊」。想睇效果可以撳「載入示範」。'
  },
  en: {
    title:'Teams',
    lblPeople:'Members <span class="tag">one per line, weight optional</span>',
    phPeople:'Alice 3\nBob 2\nCarol\n(no number = weight 1)',
    lblCannot:'Cannot be together <span class="tag">one pair per line: A ! B</span>',
    phCannot:'Alice ! Bob\nX ! Y ! Z',
    lblMust:'Must be together <span class="tag">one pair per line: A + B</span>',
    phMust:'Bob + Dave',
    lblRepeat:'Repeatable (across teams) <span class="tag">name = in every team · name 2 = up to 2 teams</span>',
    phRepeat:'Coach\nHelper 2',
    lblTeams:'Teams <span class="tag">blank = auto</span>',
    lblSizeMode:'Team size',
    optCap:'Limit (max N)',
    optRandom:'Random (min–max)',
    lblSeed:'Seed (same seed = same result)',
    phSeed:'random',
    lblSizeMin:'Min per team',
    lblMaxPer:'Max per team <span class="tag">0 = no limit</span>',
    lblMaxPerRandom:'Max per team (random upper bound)',
    lblBalance:'Balance total weight',
    hint:'Rules: <code>!</code>, <code>×</code> or <code>,</code> means “keep apart”; <code>+</code> means “keep together”. Names must match the list above.<br>Want <b>3 people (or more) all in different teams</b>? Put them on one line — <code>X ! Y ! Z</code> (auto-expands to every pair).<br>Repeatable column: <code>Coach</code> = in every team; <code>Helper 2</code> = in up to 2 teams (picks the teams that need it most). “Every team” members are excluded from weight balancing.<br>You don’t have to fill the list — once a per-team size is set, the leftover places show as “empty” seats you can fill later.',
    btnGo:'Build teams!', btnReroll:'Re-roll (new seed)', btnCopy:'Copy result', btnDemo:'Load demo',
    okBanner:'✅ All rules satisfied — {T} teams, {N} members',
    withRepeats:' ({k} repeatable)',
    sizeRandom:' · random team size {a}–{b}',
    sizeCap:' · max {n} per team',
    actualSizes:'<br>Actual team sizes: {list}',
    teamWord:'Team', membersWord:'members · total weight {w}',
    everyTeam:'every', seat:'empty', empty:'(empty)',
    needInput:'Enter a list, or set “max per team” to lay out empty seats only.',
    emptyListNote:'The list is empty — laying out seats only; add names later.',
    autoTeams:'Teams left blank → using {n} automatically',
    solved:'(solved in {ms}ms, seed {s})',
    copied:'Copied ✓', copyFail:'Copy failed — long-press the result to copy',
    idle:'Enter a list (plus any rules), then press “Build teams!”. Try “Load demo” to see it work.'
  }
};
let LANG = 'zh';
function t(key, params){
  let s = (DICT[LANG] && DICT[LANG][key]) || DICT.zh[key] || key;
  if(params) Object.keys(params).forEach(k => { s = s.split('{' + k + '}').join(params[k]); });
  return s;
}

/* ---------- persistence ---------- */
function save(){
  try{
    localStorage.setItem(LS, JSON.stringify({
      people:els.people.value, cannot:els.cannot.value, must:els.must.value, repeat:els.repeat.value,
      teams:els.teams.value, maxPer:els.maxPer.value, seed:els.seed.value, balance:els.balance.checked,
      sizeMode:els.sizeMode.value, sizeMin:els.sizeMin.value, lang:LANG
    }));
  }catch(e){}
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(LS) || 'null');
    if(!s){ LANG = (navigator.language || 'zh').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en'; return; }
    LANG = s.lang === 'en' ? 'en' : (s.lang === 'zh' ? 'zh' : ((navigator.language || 'zh').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en'));
    els.people.value = s.people || ''; els.cannot.value = s.cannot || ''; els.must.value = s.must || '';
    els.repeat.value = s.repeat || '';
    if(s.teams !== undefined) els.teams.value = s.teams;
    if(s.maxPer !== undefined) els.maxPer.value = s.maxPer;
    if(s.sizeMode) els.sizeMode.value = s.sizeMode;
    if(s.sizeMin !== undefined) els.sizeMin.value = s.sizeMin;
    if(s.seed) els.seed.value = s.seed;
    if(typeof s.balance === 'boolean') els.balance.checked = s.balance;
  }catch(e){}
}

function updateSizeMode(){
  const r = els.sizeMode.value === 'random';
  els.sizeMinWrap.classList.toggle('hidden', !r);
  els.maxPerLabel.innerHTML = t(r ? 'lblMaxPerRandom' : 'lblMaxPer');
}

function applyLang(){
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-Hant';
  document.title = LANG === 'en' ? 'Teams' : '分隊';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph'))); });
  els.langZh.classList.toggle('on', LANG === 'zh');
  els.langEn.classList.toggle('on', LANG === 'en');
  updateSizeMode();
}

/* ---------- render ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(res){
  els.status.innerHTML = res.warnings.map(w => `<div class="warn">⚠️ ${esc(w)}</div>`).join('');
  const n = res.teams.reduce((s,t) => s + t.members.length, 0);
  const caps = res.caps || null;
  const maxCap = caps && caps.length ? caps[0] : 0;
  const anyCap = !!(caps && caps.some(c => c > 0));
  if(n || anyCap){
    const max = Math.max(...res.teams.map(t => t.weight)) || 1;
    const nRep = (res.repeats || []).length;
    if(res.ok){
      let head = t('okBanner', {T:res.teams.length, N:n});
      if(nRep) head += t('withRepeats', {k:nRep});
      head += res.sizeRange ? t('sizeRandom', {a:res.sizeRange.min, b:res.sizeRange.max}) : (maxCap ? t('sizeCap', {n:maxCap}) : '');
      if(res.sizeRange && caps) head += t('actualSizes', {list:caps.join(' / ')});
      els.status.insertAdjacentHTML('afterbegin', `<div class="good">${head}</div>`);
    }
    els.results.innerHTML = res.teams.map((t_,i) => `
      <div class="team">
        <h2>${t('teamWord')} ${LETTERS[i] || '#'+(i+1)} <em>${t_.count}${caps && caps[i] ? '/'+caps[i] : ''} ${t('membersWord', {w:t_.weight})}</em></h2>
        <div class="bar"><i style="width:${Math.round(t_.weight/max*100)}%"></i></div>
        <ul class="members">
          ${t_.members.map(m => `<li class="${m.repeat ? 'rep' : ''}">${esc(m.name)}${m.weight !== 1 ? `<b>${m.weight}</b>` : ''}${m.repeat ? `<b class="repb">${m.repeat === 'all' ? t('everyTeam') : '×' + m.repeat}</b>` : ''}</li>`).join('')}${caps && caps[i] ? Array.from({length: Math.max(0, caps[i] - t_.count)}, () => `<li class="seat">${t('seat')}</li>`).join('') : (t_.members.length ? '' : `<li style="color:var(--dim)">${t('empty')}</li>`)}
        </ul>
      </div>`).join('');
  }else{
    els.results.innerHTML = '';
    els.status.insertAdjacentHTML('afterbegin', `<div class="warn">${t('needInput')}</div>`);
  }
}

/* ---------- run ---------- */
function run(newSeed){
  const parsed = TeamSolver.parsePeople(els.people.value, LANG);
  const cannot = TeamSolver.parsePairs(els.cannot.value, LANG);
  const must = TeamSolver.parsePairs(els.must.value, LANG);
  const rep = TeamSolver.parseRepeat(els.repeat.value, LANG);
  const randomSizes = els.sizeMode.value === 'random';
  const maxPer = parseInt(els.maxPer.value, 10) || 0;
  const sizeMin = Math.max(1, parseInt(els.sizeMin.value, 10) || 1);
  const sizeMax = randomSizes ? Math.max(sizeMin, maxPer || 10) : 0;
  let teamCount = parseInt(els.teams.value, 10) || 0;
  const autoTeamCount = !teamCount;
  if(!teamCount) teamCount = TeamSolver.autoTeams(parsed.people.length, sizeMax || maxPer);
  let seed = parseInt(els.seed.value, 10);
  if(newSeed || !seed){ seed = Math.floor(Math.random() * 999999) + 1; els.seed.value = seed; }
  const t0 = performance.now();
  const res = TeamSolver.solve({
    people: parsed.people,
    teams: teamCount,
    maxPerTeam: randomSizes ? 0 : maxPer,
    sizeMin: sizeMin,
    sizeMax: sizeMax,
    cannotPairs: cannot.pairs,
    mustPairs: must.pairs,
    repeat: rep.items,
    balance: els.balance.checked,
    seed: seed,
    lang: LANG,
    iterations: 6000,
    restarts: 12
  });
  res.warnings = parsed.warnings.concat(cannot.warnings, must.warnings, rep.warnings, res.warnings);
  if(!els.people.value.trim()) res.warnings.unshift(t('emptyListNote'));
  if(autoTeamCount && parsed.people.length) res.warnings.unshift(t('autoTeams', {n:teamCount}));
  const ms = Math.round(performance.now() - t0);
  if(res.teams.length) res.warnings.push(t('solved', {ms:ms, s:seed}));
  render(res);
  window.__last = res;
  save();
}

/* ---------- events ---------- */
els.go.addEventListener('click', () => run(false));
els.reroll.addEventListener('click', () => run(true));
[els.people, els.cannot, els.must, els.repeat, els.teams, els.maxPer, els.sizeMin, els.seed, els.balance].forEach(el => {
  el.addEventListener('input', save); el.addEventListener('change', save);
});
els.sizeMode.addEventListener('change', () => { updateSizeMode(); save(); });
els.langZh.addEventListener('click', () => switchLang('zh'));
els.langEn.addEventListener('click', () => switchLang('en'));
function switchLang(l){
  if(LANG === l) return;
  LANG = l;
  applyLang();
  save();
  if(window.__last) run(false);            // re-solve so warnings come out in the new language
}
els.copy.addEventListener('click', async () => {
  const res = window.__last; if(!res) return;
  const caps = res.caps || null;
  const txt = res.teams.map((t_,i) =>
    `${t('teamWord')} ${LETTERS[i] || '#'+(i+1)} (${t_.count}${caps && caps[i] ? '/'+caps[i] : ''} ${t('membersWord', {w:t_.weight})})` +
    (caps && caps[i] && caps[i] > t_.count ? ` [${t('seat')} ${caps[i] - t_.count}]` : '') + '\n' +
    t_.members.map(m => `  - ${m.name}${m.weight !== 1 ? ' ('+m.weight+')' : ''}${m.repeat ? (m.repeat === 'all' ? ` [${t('everyTeam')}]` : ' [×'+m.repeat+']') : ''}`).join('\n')
  ).join('\n\n');
  try{ await navigator.clipboard.writeText(txt); els.go.textContent = t('copied'); setTimeout(()=>els.go.textContent = t('btnGo'), 1200); }
  catch(e){ els.status.insertAdjacentHTML('afterbegin', `<div class="warn">${t('copyFail')}</div>`); }
});

  if(LANG === 'en'){
