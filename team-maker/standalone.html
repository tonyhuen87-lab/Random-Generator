<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Teams">
<meta name="theme-color" content="#0b0f14">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Teams · 分隊</title>
<style>
  :root{
    --bg:#0b0f14; --card:#141b23; --card2:#1b242e; --line:#26313d;
    --fg:#e8eef5; --dim:#8fa1b3; --accent:#4ea1ff; --ok:#35d07f; --warn:#ffb020; --bad:#ff5f56;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans CJK TC",system-ui,sans-serif;
    padding:16px 16px calc(24px + env(safe-area-inset-bottom));
    max-width:640px;margin:0 auto;
  }
  h1{font-size:20px;margin:4px 0 14px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  h1 small{color:var(--dim);font-weight:400;font-size:12px}
  h1 .langwrap{margin-left:auto;display:flex;align-items:center;gap:6px}
  h1 .globe{font-size:15px;color:var(--dim)}
  h1 .lang{display:flex;gap:0;border:1px solid var(--accent);border-radius:999px;overflow:hidden;box-shadow:0 0 0 3px rgba(78,161,255,.12)}
  h1 .lang button{background:transparent;border:0;color:var(--fg);font-size:15px;font-weight:700;padding:8px 16px;border-radius:0}
  h1 .lang button.on{background:var(--accent);color:#04121f}
  .team.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(78,161,255,.16)}
  .team.bench{border-style:dashed;background:transparent}
  .pickbtn{background:var(--card2);border:1px solid var(--line);color:var(--dim);font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .pickbtn.on{background:var(--accent);border-color:var(--accent);color:#04121f}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  label{display:block;font-size:13px;color:var(--dim);margin:0 0 6px}
  label .tag{color:var(--fg);font-size:12px;background:var(--card2);border-radius:6px;padding:1px 6px;margin-left:6px}
  textarea{
    width:100%;resize:vertical;background:var(--card2);color:var(--fg);
    border:1px solid var(--line);border-radius:12px;padding:12px;
    font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  #people{min-height:140px}
  .rule{min-height:64px}
  textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-2px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .row > *{flex:1 1 auto}
  input[type=number]{background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px 10px;font-size:15px;min-width:0;width:100%}
  select{background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px 10px;font-size:15px;width:100%;min-width:0}
  button{border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:600;background:var(--card2);color:var(--fg);cursor:pointer}
  button:active{transform:scale(.98)}
  button.primary{background:var(--accent);color:#04121f;width:100%;font-size:18px;padding:17px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-size:14px;padding:10px 12px;flex:0 0 auto}
  .switch{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--dim);flex:1 1 auto}
  .switch input{width:20px;height:20px;accent-color:var(--accent)}
  .hint{font-size:12px;color:var(--dim);margin-top:8px}
  .hint code{background:var(--card2);padding:1px 5px;border-radius:5px}
  .team{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:var(--card)}
  .team h2{font-size:16px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:center}
  .team h2 em{font-style:normal;font-size:12px;color:var(--dim);font-weight:400}
  .team h2 em.over{color:var(--bad);font-weight:700}
  .ver{color:var(--dim);font-size:11px;text-align:center;margin:18px 0 4px;letter-spacing:.5px}
  .members{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
  .members li{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:14px}
  .members li b{color:var(--accent);font-weight:600;font-size:12px;margin-left:5px}
  .members li.rep{border-color:#2b6b47;background:linear-gradient(180deg,#12291d,#141b23)}
  .members li.seat{border-style:dashed;background:transparent;color:var(--dim)}
  .members li b.repb{color:var(--ok)}
  .bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .warn{background:#2a2113;border:1px solid #6b5220;color:var(--warn);border-radius:12px;padding:11px 13px;font-size:13px;margin-bottom:10px}
  .good{background:#10251a;border:1px solid #2b6b47;color:var(--ok);border-radius:12px;padding:11px 13px;font-size:13px;margin-bottom:10px}
  .hidden{display:none !important}
</style>
</head>
<body>
<h1><span data-i18n="title">分隊</span> <small>team maker</small>
  <span class="langwrap"><span class="globe">🌐</span><span class="lang">
    <button id="langZh" type="button">中文</button><button id="langEn" type="button">EN</button>
  </span></span>
</h1>

<div class="card">
  <label data-i18n="lblPeople"></label>
  <textarea id="people" spellcheck="false" data-i18n-ph="phPeople"></textarea>
  <label style="margin-top:12px" data-i18n="lblCannot"></label>
  <textarea id="cannot" class="rule" spellcheck="false" data-i18n-ph="phCannot"></textarea>
  <label style="margin-top:12px" data-i18n="lblMust"></label>
  <textarea id="must" class="rule" spellcheck="false" data-i18n-ph="phMust"></textarea>
  <label style="margin-top:12px" data-i18n="lblRepeat"></label>
  <textarea id="repeat" class="rule" spellcheck="false" data-i18n-ph="phRepeat"></textarea>
  <div class="row">
    <div style="flex:1 1 90px">
      <label data-i18n="lblTeams"></label>
      <input type="number" id="teams" value="3" min="0" max="20" step="1">
    </div>
    <div style="flex:1 1 130px">
      <label data-i18n="lblSizeMode"></label>
      <select id="sizeMode">
        <option value="cap" data-i18n="optCap"></option>
        <option value="random" data-i18n="optRandom"></option>
      </select>
    </div>
    <div style="flex:1 1 110px">
      <label data-i18n="lblSeed"></label>
      <input type="number" id="seed" min="1" step="1" data-i18n-ph="phSeed">
    </div>
  </div>
  <div class="row">
    <div style="flex:1 1 80px" class="hidden" id="sizeMinWrap">
      <label data-i18n="lblSizeMin"></label>
      <input type="number" id="sizeMin" value="1" min="1" max="99" step="1">
    </div>
    <div style="flex:1 1 80px">
      <label id="maxPerLabel"></label>
      <input type="number" id="maxPer" value="0" min="0" max="99" step="1">
    </div>
  </div>
  <div class="row">
    <label class="switch"><input type="checkbox" id="balance" checked> <span data-i18n="lblBalance"></span></label>
    <label class="switch"><input type="checkbox" id="autoGrow" checked> <span data-i18n="lblAutoGrow"></span></label>
    <label class="switch"><input type="checkbox" id="randomPick"> <span data-i18n="lblRandomPick"></span></label>
  </div>
  <div class="hint" data-i18n="hint"></div>
</div>

<button class="primary" id="go" data-i18n="btnGo"></button>
<div class="row" style="margin-top:10px">
  <button class="ghost" id="reroll" data-i18n="btnReroll"></button>
  <button class="ghost" id="copy" data-i18n="btnCopy"></button>
  <button class="ghost" id="demo" data-i18n="btnDemo"></button>
</div>

<div id="status" style="margin-top:14px"></div>
<div class="row hidden" id="toolbar" style="margin:0 0 12px">
  <button class="ghost" id="pickTeam" data-i18n="btnPickRandom"></button>
  <button class="ghost" id="copyTeam" data-i18n="btnCopyTeam"></button>
</div>
<div class="good hidden" id="chosenInfo"></div>
<div id="results"></div>

<div class="ver" id="ver"></div>

<script>
/* Team Maker — pure solver (no DOM).
   Works in the browser (window.TeamSolver) and in Node (module.exports).

   Splits a weighted list into T teams while:
     (a) never putting a "cannot be together" pair in the same team,
     (b) keeping "must be together" pairs in the same team,
     (c) balancing total weight per team,
     (d) letting some people be "repeatable": in every team, or in up to N teams.
*/
(function (root, factory) {
  var api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  if (root) root.TeamSolver = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  /* ---------- user-facing messages (zh-Hant / en) ---------- */
  var MSG = {
    zh: {
      badWeight: function (line) { return '「' + line + '」權重唔合理，當 1 計'; },
      dupName: function (n) { return '重複名「' + n + '」，只用第一個'; },
      pairTooMany: function (line, k) { return '「' + line + '」有 ' + k + ' 個名 → 當佢咁互相都唔同隊'; },
      pairMalformed: function (line) { return '「' + line + '」格式唔啱（要 A ! B）'; },
      repeatNoName: function (line) { return '「' + line + '」冇名字，已略過'; },
      repeatOne: function (n) { return '「' + n + '」寫咗 1 隊，即係唔會重複，已當普通成員'; },
      repeatUnknown: function (n) { return '「' + n + '」設定咗可重複，但唔喺名單，已略過'; },
      repeatOnly: function () { return '只剩可重複嘅人，冇普通成員可分'; },
      optionalUnknown: function (n) { return '「' + n + '」設定咗可以唔入隊，但唔喺名單，已略過'; },
      benchNote: function (k) { return '有 ' + k + ' 個人冇入任何隊（未入選）'; },
      neverSeparate: function (a, b) { return '「' + a + '」每隊都有，所以同「' + b + '」冇可能唔同隊 → 已略過呢條規則'; },
      repeatMust: function (a, b) { return '「' + a + ' / ' + b + '」涉及可重複嘅人，唔支援「必須同隊」，已略過'; },
      unknownCannot: function (a, b) { return '唔可以同隊「' + a + ' / ' + b + '」入面有名字唔喺名單，已略過'; },
      unknownMust: function (a, b) { return '必須同隊「' + a + ' / ' + b + '」入面有名字唔喺名單，已略過'; },
      ruleClash: function (k) { return '規則本身打架：有 ' + k + ' 對同時「必須同隊」又「唔可以同隊」，冇可能同時滿足'; },
      tooManyTeams: function (T, B) { return '隊數（' + T + '）多過可以獨立分嘅組數（' + B + '），會有空隊'; },
      notEnoughSeats: function (mx, T, tot, need) { return '每隊最多 ' + mx + ' 人 × ' + T + ' 隊 = ' + tot + ' 個位，唔夠放 ' + need + ' 人 —— 加隊數或者提高上限'; },
      stillOverlap: function (k) { return '有 ' + k + ' 對「唔可以同隊」仍然有重疊（規則太多／衝突，冇完美解）'; },
      overCap: function (k) { return '有 ' + k + ' 個人超出每隊人數上限 —— 隊數唔夠，加多幾隊或者提高上限'; },
      emptyList: function () { return '名單係空嘅'; }
    },
    en: {
      badWeight: function (line) { return 'Weight on "' + line + '" looks wrong — using 1'; },
      dupName: function (n) { return 'Duplicate name "' + n + '" — keeping the first one'; },
      pairTooMany: function (line, k) { return '"' + line + '" lists ' + k + ' names → treated as all-separate'; },
      pairMalformed: function (line) { return '"' + line + '" looks wrong (use A ! B)'; },
      repeatNoName: function (line) { return '"' + line + '" has no name — skipped'; },
      repeatOne: function (n) { return '"' + n + '" says 1 team, so it does not repeat — treated as a normal member'; },
      repeatUnknown: function (n) { return '"' + n + '" is marked repeatable but is not in the list — skipped'; },
      repeatOnly: function () { return 'Only repeatable members left — there is nothing to split'; },
      optionalUnknown: function (n) { return '"' + n + '" is marked optional but is not in the list — skipped'; },
      benchNote: function (k) { return k + ' member(s) were not selected into any team'; },
      neverSeparate: function (a, b) { return '"' + a + '" is in every team, so it can never be apart from "' + b + '" — rule dropped'; },
      repeatMust: function (a, b) { return '"' + a + ' / ' + b + '" involves a repeatable member — "must be together" is not supported, rule dropped'; },
      unknownCannot: function (a, b) { return 'Cannot-be-together "' + a + ' / ' + b + '" mentions a name that is not in the list — skipped'; },
      unknownMust: function (a, b) { return 'Must-be-together "' + a + ' / ' + b + '" mentions a name that is not in the list — skipped'; },
      ruleClash: function (k) { return 'Rules contradict each other: ' + k + ' pair(s) are both "must be together" and "cannot be together"'; },
      tooManyTeams: function (T, B) { return 'More teams (' + T + ') than independent groups (' + B + ') — some teams will stay empty'; },
      notEnoughSeats: function (mx, T, tot, need) { return 'Max ' + mx + ' per team × ' + T + ' teams = ' + tot + ' seats — not enough for ' + need + ' people. Add teams or raise the limit'; },
      stillOverlap: function (k) { return k + ' "cannot be together" pair(s) still share a team (too many or conflicting rules — no perfect solution)'; },
      overCap: function (k) { return k + ' people exceed the per-team limit — add teams or raise the limit'; },
      emptyList: function () { return 'The list is empty'; }
    }
  };
  function msg(lang, key) {
    var cat = MSG[lang === 'en' ? 'en' : 'zh'];
    var fn = cat[key] || MSG.zh[key];
    return fn.apply(null, Array.prototype.slice.call(arguments, 2));
  }

  /* ---------- seeded RNG (mulberry32) ---------- */
  function makeRng(seed) {
    var a = (seed >>> 0) || 1;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- parsing ---------- */
  // "陳大文" -> 1 ; "陳大文 3" / "陳大文,3" / "陳大文*3" / "陳大文(3)" / "陳大文=3" -> 3
  function parsePeople(text, lang) {
    var out = [], warnings = [];
    String(text || '').split(/\r?\n/).forEach(function (raw, i) {
      var line = raw.trim();
      if (!line || line.charAt(0) === '#') return;
      var name = line, weight = 1;
      var m = line.match(/^(.*?)[\s]*[\(\[,;*x×=]\s*(-?\d+(?:\.\d+)?)\s*[\)\]]?$/i);
      if (m && m[1].trim()) {
        name = m[1].trim();
        weight = parseFloat(m[2]);
      } else {
        m = line.match(/^(.*?)\s+(-?\d+(?:\.\d+)?)$/);
        if (m && m[1].trim()) { name = m[1].trim(); weight = parseFloat(m[2]); }
      }
      if (!isFinite(weight) || weight <= 0) {
        warnings.push(msg(lang, 'badWeight', line));
        weight = 1;
      }
      if (weight > 100) { weight = 100; }
      out.push({ name: name, weight: weight, line: i + 1 });
    });
    var seen = Object.create(null), dedup = [];
    out.forEach(function (p) {
      var k = p.name.toLowerCase();
      if (seen[k]) { warnings.push(msg(lang, 'dupName', p.name)); return; }
      seen[k] = 1; dedup.push(p);
    });
    return { people: dedup, warnings: warnings };
  }

  // "A ! B" -> [A, B]. Separators: ! ！ + × , ， / | 、 -> → 與 同 和
  // NOTE: a bare "x" is deliberately NOT a separator — names like "x" or "Max" must survive.
  function splitPair(line) {
    return line.split(/\s*(?:!|！|\+|×|,|，|\/|\||、|->|→|與|同|和)\s*/i)
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });
  }
  function parsePairs(text, lang) {
    var pairs = [], warnings = [];
    String(text || '').split(/\r?\n/).forEach(function (raw) {
      var line = raw.trim();
      if (!line || line.charAt(0) === '#') return;
      var parts = splitPair(line);
      if (parts.length === 2) {
        pairs.push([parts[0], parts[1]]);
      } else if (parts.length > 2) {
        for (var i = 0; i < parts.length; i++) {
          for (var j = i + 1; j < parts.length; j++) pairs.push([parts[i], parts[j]]);
        }
        warnings.push(msg(lang, 'pairTooMany', line, parts.length));
      } else {
        warnings.push(msg(lang, 'pairMalformed', line));
      }
    });
    return { pairs: pairs, warnings: warnings };
  }

  /* Repeatable people: "Name" = in EVERY team; "Name 2" / "Name x2" / "Name 最多2" = up to 2 teams. */
  function parseRepeat(text, lang) {
    var items = [], warnings = [];
    String(text || '').split(/\r?\n/).forEach(function (raw) {
      var line = raw.trim();
      if (!line || line.charAt(0) === '#') return;
      var name = line, teams = 0; // 0 = every team
      var m = line.match(/^(.*?)[\s]*(?:x|×|\*|=|max|最多|可|每)\s*(\d+)\s*$/i)
           || line.match(/^(.*?)\s+(\d+)\s*$/);
      if (m && m[1].trim()) { name = m[1].trim(); teams = parseInt(m[2], 10); }
      if (!name) { warnings.push(msg(lang, 'repeatNoName', line)); return; }
      if (teams === 1) { warnings.push(msg(lang, 'repeatOne', name)); }
      items.push({ name: name, teams: teams > 1 ? teams : 0 });
    });
    return { items: items, warnings: warnings };
  }

  /* ---------- union-find ---------- */
  function DSU(n) { this.p = []; for (var i = 0; i < n; i++) this.p.push(i); }
  DSU.prototype.find = function (x) {
    while (this.p[x] !== x) { this.p[x] = this.p[this.p[x]]; x = this.p[x]; }
    return x;
  };
  DSU.prototype.union = function (a, b) {
    a = this.find(a); b = this.find(b);
    if (a !== b) this.p[b] = a;
  };

  /* ---------- solve ---------- */
  function solve(opts) {
    opts = opts || {};
    var T = Math.max(1, Math.min(20, parseInt(opts.teams, 10) || 2));
    var iterations = Math.max(200, Math.min(200000, parseInt(opts.iterations, 10) || 6000));
    var restarts = Math.max(1, Math.min(50, parseInt(opts.restarts, 10) || 10));
    var balance = opts.balance !== false;
    var lang = opts.lang === 'en' ? 'en' : 'zh';
    var maxPerTeam = Math.max(0, parseInt(opts.maxPerTeam, 10) || 0);
    var sizeRange = null;
    if (parseInt(opts.sizeMax, 10) > 0) {
      var sMin = Math.max(1, parseInt(opts.sizeMin, 10) || 1);
      var sMax = Math.max(sMin, parseInt(opts.sizeMax, 10) || sMin);
      sizeRange = { min: sMin, max: sMax };
    }
    var seed = (parseInt(opts.seed, 10) || 1) >>> 0;
    var people = (opts.people || []).slice();
    var warnings = [];

    var index = Object.create(null);
    people.forEach(function (p, i) { index[p.name.toLowerCase()] = i; });

    if (people.length === 0) {
      // No names at all: still lay out the teams so the empty seats can be planned/filled in later.
      var seatCaps = null;
      if (sizeRange) {
        var sr = makeRng((seed ^ 0x5bf03635) >>> 0);
        seatCaps = [];
        for (var sc = 0; sc < T; sc++) seatCaps.push(sizeRange.min + Math.floor(sr() * (sizeRange.max - sizeRange.min + 1)));
      } else if (maxPerTeam > 0) {
        seatCaps = [];
        for (var sc2 = 0; sc2 < T; sc2++) seatCaps.push(maxPerTeam);
      }
      var seatTeams = [];
      for (var s0 = 0; s0 < T; s0++) seatTeams.push({ id: s0, members: [], count: 0, weight: 0, cap: seatCaps ? seatCaps[s0] : 0 });
      return { teams: seatTeams, repeats: [], bench: [], violations: [], conflicts: [], warnings: [], imbalance: 0, maxPerTeam: maxPerTeam, caps: seatCaps, sizeRange: sizeRange, ok: true };
    }

    /* ---- split repeatable people out of the core ---- */
    var repeatOf = Object.create(null);   // lowercased name -> {max}   (max 0 = every team)
    var repeatList = [];                  // ordered repeat names
    (opts.repeat || []).forEach(function (spec) {
      var key = String(spec.name).toLowerCase();
      if (index[key] === undefined) {
        warnings.push(msg(lang, 'repeatUnknown', spec.name));
        return;
      }
      var max = parseInt(spec.teams, 10) || 0;
      if (max > T) max = 0;               // asking for more teams than exist = every team
      if (max === 1) max = 0;
      if (repeatOf[key] === undefined) repeatList.push(key);
      repeatOf[key] = { max: max, name: people[index[key]].name, weight: people[index[key]].weight };
    });

    // Optional people may end up in NO team; everybody else must be placed.
    var optionalKeys = Object.create(null);
    (opts.optional || []).forEach(function (spec) {
      var nm = (spec && spec.name !== undefined) ? spec.name : spec;
      var ok = String(nm).toLowerCase();
      if (index[ok] === undefined) { warnings.push(msg(lang, 'optionalUnknown', nm)); return; }
      optionalKeys[ok] = 1;
    });

    var core = [], coreByName = Object.create(null), optionalFlags = [];
    people.forEach(function (p) {
      var k = p.name.toLowerCase();
      if (repeatOf[k] === undefined) {
        coreByName[k] = core.length;
        optionalFlags.push(optionalKeys[k] ? 1 : 0);
        core.push(p);
      }
    });

  },
  en: {

let LANG = 'zh';
let chosen = null;   // index of the team the user picked, or null
function t(key, params){
  let s = (DICT[LANG] && DICT[LANG][key]) || DICT.zh[key] || key;
  if(params) Object.keys(params).forEach(k => { s = s.split('{' + k + '}').join(params[k]); });
  return s;
}

/* ---------- persistence ---------- */
function save(){
  try{
    localStorage.setItem(LS, JSON.stringify({
      people:els.people.value, cannot:els.cannot.value, must:els.must.value, repeat:els.repeat.value,
      teams:els.teams.value, maxPer:els.maxPer.value, seed:els.seed.value, balance:els.balance.checked,
      sizeMode:els.sizeMode.value, sizeMin:els.sizeMin.value, lang:LANG, autoGrow:els.autoGrow.checked, randomPick:els.randomPick.checked
    }));
  }catch(e){}
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(LS) || 'null');
    if(!s){ LANG = (navigator.language || 'zh').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en'; return; }
    LANG = s.lang === 'en' ? 'en' : (s.lang === 'zh' ? 'zh' : ((navigator.language || 'zh').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en'));
    els.people.value = s.people || ''; els.cannot.value = s.cannot || ''; els.must.value = s.must || '';
    els.repeat.value = s.repeat || '';
    if(s.teams !== undefined) els.teams.value = s.teams;
    if(s.maxPer !== undefined) els.maxPer.value = s.maxPer;
    if(s.sizeMode) els.sizeMode.value = s.sizeMode;
    if(s.sizeMin !== undefined) els.sizeMin.value = s.sizeMin;
    if(s.seed) els.seed.value = s.seed;
    if(typeof s.balance === 'boolean') els.balance.checked = s.balance;
    if(typeof s.autoGrow === 'boolean') els.autoGrow.checked = s.autoGrow;
    if(typeof s.randomPick === 'boolean') els.randomPick.checked = s.randomPick;
  }catch(e){}
}

function updateSizeMode(){
  const r = els.sizeMode.value === 'random';
  els.sizeMinWrap.classList.toggle('hidden', !r);
  els.maxPerLabel.innerHTML = t(r ? 'lblMaxPerRandom' : 'lblMaxPer');
  updateVer();
}

function updateVer(){
  const rnd = els.sizeMode.value === 'random';
  const rg = TeamSolver.normalizeRange(els.sizeMin.value, els.maxPer.value);
  els.ver.textContent = VERSION + ' · ' + (rnd ? ('random ' + rg.min + '–' + rg.max) : ('max ' + (TeamSolver.parseCap(els.maxPer.value) || '∞')));
}

function applyLang(){
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-Hant';
  document.title = LANG === 'en' ? 'Teams' : '分隊';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph'))); });
  els.langZh.classList.toggle('on', LANG === 'zh');
  els.langEn.classList.toggle('on', LANG === 'en');
  updateSizeMode();
}

/* ---------- render ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(res){
  els.status.innerHTML = res.warnings.map(w => `<div class="warn">⚠️ ${esc(w)}</div>`).join('');
  const n = res.teams.reduce((s,t) => s + t.members.length, 0);
  const caps = res.caps || null;
  const maxCap = caps && caps.length ? caps[0] : 0;
  const anyCap = !!(caps && caps.some(c => c > 0));
  if(n || anyCap){
    const max = Math.max(...res.teams.map(t => t.weight)) || 1;
    const nRep = (res.repeats || []).length;
    if(res.ok){
      let head = t('okBanner', {T:res.teams.length, N:n});
      if(nRep) head += t('withRepeats', {k:nRep});
      head += res.sizeRange ? t('sizeRandom', {a:res.sizeRange.min, b:res.sizeRange.max}) : (maxCap ? t('sizeCap', {n:maxCap}) : '');
      if(res.sizeRange && caps) head += t('actualSizes', {list:caps.join(' / ')});
      els.status.insertAdjacentHTML('afterbegin', `<div class="good">${head}</div>`);
    }
    const benchHtml = (res.bench && res.bench.length) ? `
      <div class="team bench">
        <h2><span>${t('notPicked', {n: res.bench.length})}</span></h2>
        <ul class="members">
          ${res.bench.map(m => `<li class="seat">${esc(m.name)}${m.weight !== 1 ? `<b>${m.weight}</b>` : ''}</li>`).join('')}
        </ul>
      </div>` : '';
    els.results.innerHTML = res.teams.map((t_,i) => `
      <div class="team${chosen === i ? ' sel' : ''}">
        <h2><span>${t('teamWord')} ${LETTERS[i] || '#'+(i+1)}</span> <em class="${caps && caps[i] && t_.count > caps[i] ? 'over' : ''}">${t_.count}${caps && caps[i] ? '/'+caps[i] : ''} ${t('membersWord', {w:t_.weight})}</em><button class="pickbtn${chosen === i ? ' on' : ''}" data-team="${i}" type="button">${chosen === i ? t('btnPicked') : t('btnPick')}</button></h2>
        <div class="bar"><i style="width:${Math.round(t_.weight/max*100)}%"></i></div>
        <ul class="members">
          ${t_.members.map(m => `<li class="${m.repeat ? 'rep' : ''}">${esc(m.name)}${m.weight !== 1 ? `<b>${m.weight}</b>` : ''}${m.repeat ? `<b class="repb">${m.repeat === 'all' ? t('everyTeam') : '×' + m.repeat}</b>` : ''}</li>`).join('')}${caps && caps[i] ? Array.from({length: Math.max(0, caps[i] - t_.count)}, () => `<li class="seat">${t('seat')}</li>`).join('') : (t_.members.length ? '' : `<li style="color:var(--dim)">${t('empty')}</li>`)}
        </ul>
      </div>`).join('') + benchHtml;
    els.toolbar.classList.toggle('hidden', !res.teams.length);
    if(chosen !== null && res.teams[chosen]){
      els.chosenInfo.classList.remove('hidden');
      els.chosenInfo.textContent = t('chosenTitle', {team: (LETTERS[chosen] || '#'+(chosen+1)), n: res.teams[chosen].count});
    }else{
      els.chosenInfo.classList.add('hidden');
    }
  }else{
    els.results.innerHTML = '';
    els.toolbar.classList.add('hidden');
    els.chosenInfo.classList.add('hidden');
    els.status.insertAdjacentHTML('afterbegin', `<div class="warn">${t('needInput')}</div>`);
  }
}

/* ---------- run ---------- */
function run(newSeed, keepChosen){
  const parsed = TeamSolver.parsePeople(els.people.value, LANG);
  const cannot = TeamSolver.parsePairs(els.cannot.value, LANG);
  const must = TeamSolver.parsePairs(els.must.value, LANG);
  const rep = TeamSolver.parseRepeat(els.repeat.value, LANG);
  const randomPick = els.randomPick.checked;
  // Random-pick mode: everybody is a candidate, so the solver may leave people out.
  const optionalNames = randomPick ? parsed.people.map(function(p){ return p.name; }) : [];
  const randomSizes = els.sizeMode.value === 'random';
  const range = TeamSolver.normalizeRange(els.sizeMin.value, els.maxPer.value);
  // Cap mode: use the max box ONLY (a stale hidden "min" used to inflate the cap).
  const maxPer = randomSizes ? range.max : TeamSolver.parseCap(els.maxPer.value);
  const sizeMin = randomSizes ? range.min : 1;
  const sizeMax = randomSizes ? range.max : 0;
  const perTeamCap = randomSizes ? range.max : maxPer;
  const pinned = parseInt(els.teams.value, 10) || 0;
  // planTeams settles the final count: auto-grow on → the cap wins; off → your number wins
  // (so lowering the team count always shrinks back).
  const planCore = randomPick ? (pinned ? 0 : parsed.people.length) : parsed.people.length;
  const plan = TeamSolver.planTeams({
    pinned: pinned,
    cap: perTeamCap,
    core: planCore,
    repeats: rep.items,
    autoGrow: els.autoGrow.checked
  });
  let teamCount = plan.teams;
  let seed = parseInt(els.seed.value, 10);
  if(newSeed || !seed){ seed = Math.floor(Math.random() * 999999) + 1; els.seed.value = seed; }
  const t0 = performance.now();
  const res = TeamSolver.solve({
    people: parsed.people,
    teams: teamCount,
    maxPerTeam: randomSizes ? 0 : maxPer,
    sizeMin: sizeMin,
    sizeMax: sizeMax,
    cannotPairs: cannot.pairs,
    mustPairs: must.pairs,
    repeat: rep.items,
    optional: optionalNames,
    balance: els.balance.checked,
    seed: seed,
    lang: LANG,
    iterations: 6000,
    restarts: 12
  });
  res.warnings = parsed.warnings.concat(cannot.warnings, must.warnings, rep.warnings, res.warnings);
  if(!els.people.value.trim()) res.warnings.unshift(t('emptyListNote'));
  if(plan.grew) res.warnings.unshift(t('autoGrew', {n: teamCount, cap: perTeamCap}));
  else if(perTeamCap > 0 && !plan.ok) res.warnings.unshift(t('capBreak', {need: plan.minRequired, cap: perTeamCap, n: teamCount}));
  if(!randomSizes && perTeamCap > 0) res.warnings.unshift(t('capHard', {cap: perTeamCap}));
  if(randomSizes){
    if(range.note === 'blank') res.warnings.unshift(t('sizeMaxBlank', {n: range.max}));
    else if(range.note === 'minLowered') res.warnings.unshift(t('sizeMaxTooSmall', {n: range.max}));
    if(range.fixed) res.warnings.unshift(t('sizeMinEqMax', {n: range.max}));
  }
  if(plan.pinned === 0 && parsed.people.length) res.warnings.unshift(t('autoTeams', {n: teamCount}));
  const ms = Math.round(performance.now() - t0);
  if(res.teams.length) res.warnings.push(t('solved', {ms:ms, s:seed}));
  if(!keepChosen) chosen = null;
  updateVer();
  render(res);
  window.__last = res;
  save();
}

/* ---------- events ---------- */
els.go.addEventListener('click', () => run(false));
els.reroll.addEventListener('click', () => run(true));
[els.people, els.cannot, els.must, els.repeat, els.teams, els.maxPer, els.sizeMin, els.seed, els.balance, els.autoGrow, els.randomPick].forEach(el => {
  el.addEventListener('input', save); el.addEventListener('change', save);
});
els.sizeMode.addEventListener('change', () => {
  // Switching to random mode: make the upper bound visible instead of defaulting to a hidden number.
  if(els.sizeMode.value === 'random' && !(parseInt(els.maxPer.value, 10) > 0)){
    els.maxPer.value = Math.max(1, parseInt(els.sizeMin.value, 10) || 1);
  }
  updateSizeMode(); save();
});
els.langZh.addEventListener('click', () => switchLang('zh'));
els.langEn.addEventListener('click', () => switchLang('en'));
function switchLang(l){
  if(LANG === l) return;
  LANG = l;
  applyLang();
  save();
  if(window.__last) run(false, true);      // re-solve so warnings come out in the new language
}
els.pickTeam.addEventListener('click', () => {
  const res = window.__last;
  if(!res || !res.teams.length) return;
  chosen = TeamSolver.randomIndex(res.teams.length, Date.now() & 0x7fffffff);
  render(res);
});
els.copyTeam.addEventListener('click', async () => {
  const res = window.__last;
  if(!res || chosen === null || !res.teams[chosen]) return;
  const tm = res.teams[chosen];
  const txt = `${t('teamWord')} ${LETTERS[chosen] || '#'+(chosen+1)} (${tm.count} ${t('membersWord', {w:tm.weight})})\n` +
    tm.members.map(m => `  - ${m.name}${m.weight !== 1 ? ' ('+m.weight+')' : ''}${m.repeat ? (m.repeat === 'all' ? ` [${t('everyTeam')}]` : ' [×'+m.repeat+']') : ''}`).join('\n');
  try{ await navigator.clipboard.writeText(txt); els.chosenInfo.textContent = t('pickedCopied'); }
  catch(e){ els.status.insertAdjacentHTML('afterbegin', `<div class="warn">${t('copyFail')}</div>`); }
});
els.results.addEventListener('click', e => {
  const b = e.target && e.target.closest ? e.target.closest('.pickbtn') : null;
  if(!b) return;
  const i = parseInt(b.getAttribute('data-team'), 10);
  chosen = (chosen === i) ? null : i;
  if(window.__last) render(window.__last);
});
els.copy.addEventListener('click', async () => {
  const res = window.__last; if(!res) return;
  const caps = res.caps || null;
  const txt = res.teams.map((t_,i) =>
    `${t('teamWord')} ${LETTERS[i] || '#'+(i+1)} (${t_.count}${caps && caps[i] ? '/'+caps[i] : ''} ${t('membersWord', {w:t_.weight})})` +
    (caps && caps[i] && caps[i] > t_.count ? ` [${t('seat')} ${caps[i] - t_.count}]` : '') + '\n' +
    t_.members.map(m => `  - ${m.name}${m.weight !== 1 ? ' ('+m.weight+')' : ''}${m.repeat ? (m.repeat === 'all' ? ` [${t('everyTeam')}]` : ' [×'+m.repeat+']') : ''}`).join('\n')
  ).join('\n\n');
  try{ await navigator.clipboard.writeText(txt); els.go.textContent = t('copied'); setTimeout(()=>els.go.textContent = t('btnGo'), 1200); }
  catch(e){ els.status.insertAdjacentHTML('afterbegin', `<div class="warn">${t('copyFail')}</div>`); }
});
els.demo.addEventListener('click', () => {
  if(LANG === 'en'){
    els.people.value = 'Alice 3\nBob 2\nCarol 3\nDave 1\nErin 2\nFrank 3\nGrace 1\nHenry 2\nIvy 3\nJack 1\nKate 2\nLeo 3\nCoach 2\nHelper 1';
    els.cannot.value = 'Alice ! Bob\nCarol ! Frank\nDave ! Henry';
    els.must.value = 'Bob + Erin';
    els.repeat.value = 'Coach\nHelper 2';
  }else{
    els.people.value = '陳大文 3\n李小明 2\n黃小美 3\n張三 1\n王五 2\n趙六 3\n錢七 1\n孫八 2\n周九 3\n吳十 1\n鄭一 2\n馮二 3\n陳教練 2\n助手A 1';
    els.cannot.value = '陳大文 ! 李小明\n黃小美 ! 趙六\n張三 ! 孫八';
    els.must.value = '李小明 + 王五';
    els.repeat.value = '陳教練\n助手A 2';
  }
  els.teams.value = 3;
  els.maxPer.value = 6;
  run(true);
});

load();
applyLang();
updateVer();
if(!els.people.value) els.status.innerHTML = `<div class="hint">${t('idle')}</div>`;
</script>
